name: Refresh Credit Card Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1,4'

permissions:
  contents: write

concurrency:
  group: credit-card-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh official-source card catalogue
        run: node scripts/cards/refresh-card-catalog.mjs

      - name: Validate structured card records
        run: node scripts/cards/validate-card-data.mjs

      - name: Commit refreshed catalogue
        shell: bash
        run: |
          if git diff --quiet -- app/data/auto-card-catalog.generated.ts public/data/cards/auto-catalog.json; then
            echo "No catalogue changes."
            exit 0
          fi

          git config user.name "credonomics-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- app/data/auto-card-catalog.generated.ts public/data/cards/auto-catalog.json
          git commit -m "Refresh official credit card catalogue"
          git push
