name: Refresh Credit Card Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1,4'

permissions:
  contents: write

concurrency:
  group: credit-card-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh official-source discovery catalogue
        run: node scripts/cards/refresh-card-catalog.mjs

      - name: Build human review queue
        run: node scripts/cards/build-card-review-queue.mjs

      - name: Validate manual structured card records
        run: node scripts/cards/validate-card-data.mjs

      - name: Commit refreshed research signals
        shell: bash
        run: |
          FILES="app/data/auto-card-catalog.generated.ts public/data/cards/auto-catalog.json app/data/card-review-queue.generated.ts public/data/cards/review-queue.json"
          if git diff --quiet -- $FILES; then
            echo "No research-signal changes."
            exit 0
          fi

          git config user.name "credonomics-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- $FILES
          git commit -m "Refresh card discovery and review queue"
          git push
