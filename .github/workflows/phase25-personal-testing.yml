name: Phase25 owner-only TEST workspace
on:
  pull_request:
    branches: [codex/phase24-offline-db-recovery, feature/youpi-payment-entry-prelaunch]
permissions:
  contents: read
concurrency:
  group: phase25-${{ github.ref }}
  cancel-in-progress: true
jobs:
  personal-testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-postgres-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: All unit and API integration/regression tests
        run: npm test
      - name: Existing financial SQL regression (synthetic database only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-disposable-postgres-only
          BILLING_PG_DISPOSABLE: '1'
        run: python3 scripts/test-billing-postgres.py
      - name: Production build, types and lint (no deployment)
        run: |
          npm run build
          npm run typecheck
          npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Responsive real UI to API workflow and authorization denials
        run: npm run test:personal
      - name: Release remains blocked
        run: node scripts/check-billing-launch-readiness.mjs --assert-blocked
      # No credentials, hosted connections, deployments or uploaded record artifacts.
