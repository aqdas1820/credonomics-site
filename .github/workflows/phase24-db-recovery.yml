name: Phase24 offline Supabase database recovery (synthetic only)
on:
  pull_request:
    branches: [feature/youpi-payment-entry-prelaunch, codex/phase23-backup-integration]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Deterministic local guard and diagnostic tests
        run: python3 -m unittest discover -s scripts/db-recovery -p 'test_*.py' -v
      - name: Cache official image before the offline fixture phase
        run: |
          docker pull supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
          docker pull supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
      - name: Genuine Supabase PG17 synthetic dump/restore and RLS round trip
        run: python3 scripts/db-recovery/recovery.py synthetic
      # Deliberately no secrets, external DB URLs, private dumps or artifact upload.
