name: YouPI bridge contract verification (no live payments)
on:
  pull_request:
    branches: [codex/phase26-production-integration]
    paths:
      - 'src/lib/billing/youpi-contract*.ts'
      - 'app/api/youpi/**'
      - 'scripts/check-youpi-local.mjs'
      - '.github/workflows/youpi-bridge-contract.yml'
permissions:
  contents: read
jobs:
  safe-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict contract tests with synthetic gateway only
        run: npm test -- src/lib/billing/youpi-contract.test.ts
      - name: TypeScript and complete production build
        run: |
          npm run typecheck
          npm run build
      - name: Verify production payments remain blocked
        run: node scripts/check-billing-launch-readiness.mjs --assert-blocked
      # No real gateway requests, banking tokens, deploys, or checkout activation.
