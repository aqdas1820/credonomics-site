name: Feature request
description: Suggest an improvement to the CredoNomics web platform
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Do not include private customer, account, payment, or credential information.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user need or workflow is currently difficult or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — what other approaches did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Financial-product discovery
        - Research / content
        - Mutual-fund intelligence
        - Calculators / financial tools
        - Search / data
        - Accessibility / responsive UI
        - Developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected benefit
      description: Who benefits and how will success be measured?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not assume live-payment activation, production financial settlement, or access to private customer data.
          required: true
